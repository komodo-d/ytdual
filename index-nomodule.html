<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>YouTube Dual Sync Player (No Module)</title>
  <meta name="description" content="App web para reproducir dos videos de YouTube sincronizados con control de volumen.">
  <link rel="icon" type="image/png" href="./assets/img/favicon.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="./assets/css/styles.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-4">
    <h1 class="h3 mb-4">Cargar dos videos y reproducirlos juntos</h1>

    <div class="row g-4">
      <div class="col-12 col-lg-6">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Video A</h5>
            <div class="mb-3">
              <label for="urlA" class="form-label">URL de YouTube</label>
              <input id="urlA" type="url" class="form-control" placeholder="https://www.youtube.com/watch?v=XXXXXXXX" />
            </div>
            <div class="d-flex gap-2 align-items-end mb-3">
              <div class="flex-grow-1">
                <label class="form-label">Volumen (100%)</label>
                <input id="volA" type="range" min="0" max="100" value="100" class="form-range" />
              </div>
              <button id="btnLoadA" class="btn btn-outline-light">Cargar</button>
            </div>
            <div class="ratio ratio-16x9 yt-box">
              <div id="playerA"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="col-12 col-lg-6">
        <div class="card h-100">
          <div class="card-body">
            <h5 class="card-title">Video B</h5>
            <div class="mb-3">
              <label for="urlB" class="form-label">URL de YouTube</label>
              <input id="urlB" type="url" class="form-control" placeholder="https://youtu.be/XXXXXXXX" />
            </div>
            <div class="d-flex gap-2 align-items-end mb-3">
              <div class="flex-grow-1">
                <label class="form-label">Volumen (20%)</label>
                <input id="volB" type="range" min="0" max="100" value="20" class="form-range" />
              </div>
              <button id="btnLoadB" class="btn btn-outline-light">Cargar</button>
            </div>
            <div class="ratio ratio-16x9 yt-box">
              <div id="playerB"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div class="d-flex flex-wrap gap-2 mt-4">
      <button id="btnPlayBoth" class="btn btn-primary">▶️ Reproducir ambos</button>
      <button id="btnPauseBoth" class="btn btn-outline-light">⏸️ Pausar ambos</button>
      <button id="btnStopBoth" class="btn btn-outline-danger">⏹️ Detener ambos</button>
      <div class="ms-auto small footer-note">Nota: primero carga cada video con su botón "Cargar".</div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="./assets/js/app.nomodule.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
